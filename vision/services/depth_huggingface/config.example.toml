[mqtt]
host = "mqtt.example.net"
port = 8883
topic_root = "desk_buddy"
username_env = "DESK_BUDDY_DEPTH_MQTT_USERNAME"
password_env = "DESK_BUDDY_DEPTH_MQTT_PASSWORD"
tls = true
ca_file = "../../certs/mqtt-ca.crt"

[service]
service_id = "depth-anything-v2"
service_kind = "depth"
client_id = "desk-buddy-depth-anything-v2"
compute_device = "auto"
artifact_timeout_seconds = 120
artifact_chunk_size = 4096

[models.depth-anything-v2-small]
source = "depth-anything/Depth-Anything-V2-Small-hf"
version = "transformers-4.46"
local_files_only = true
invert = false
