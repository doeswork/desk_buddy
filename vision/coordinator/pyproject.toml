[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-buddy-vision-coordinator"
version = "0.1.0"
description = "MQTT coordinator for Desk Buddy vision, storage, calibration, and motion planning"
requires-python = ">=3.11"
dependencies = [
  "desk-buddy-vision-protocol==0.1.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "paho-mqtt>=2.1,<3",
]

[project.scripts]
desk-buddy-vision-coordinator = "desk_buddy_vision.app:main"
desk-buddy-vision-import-legacy = "desk_buddy_vision.legacy_import:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desk_buddy_vision*"]
