name: Build Desk Buddy Studio

# Builds a native executable on each OS. There is no cross-compiling:
# the Windows .exe is built by a Windows runner, the .app by a macOS runner.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DeskBuddyStudio.exe
          - os: macos-latest
            artifact: DeskBuddyStudio.app
          - os: ubuntu-latest
            artifact: DeskBuddyStudio.bin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt needs these to link on a bare Ubuntu runner.
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/requirements.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m studio.storage.tests
          python -m studio.models.tests.tests
          python -m studio.models.tests.workflow_tests
          python -m studio.services.error_reporter_tests
          python -m studio.services.network.tests.tests
          python -m studio.services.network.tests.system_tests
          python -m studio.ui.components.serial_tests
          python -m studio.ui.workspaces.network.tests
          python -m studio.ui.workspaces.calibration.tests
          python -m studio.ui.workspaces.manual_tests
          python -m studio.ui.workspaces.workflows.tests

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m studio.smoke_test

      - name: Build
        run: python studio/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: studio/dist/${{ matrix.artifact }}
          if-no-files-found: error
